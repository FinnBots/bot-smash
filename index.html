<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Bot Merge — Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --plum:#5f4c57; --plum-deep:#3e323a; --bg-soft:#fdf3e7; --card:#fffaf3; --ink:#2a2230;
    --muted:#6e6470; --electric:#3a6ff7; --amber:#f2a03d; --green:#34c759; --red:#c0392b; --line:rgba(95,76,87,0.16);
    --shadow-sm:0 1px 3px rgba(42,34,48,0.10); --shadow-md:0 6px 18px rgba(42,34,48,0.12); --shadow-lg:0 14px 34px rgba(42,34,48,0.22);
    --r-sm:8px; --r-md:10px; --r-lg:16px; --r-xl:20px; --r-pill:9999px; --smooth:cubic-bezier(.4,0,.2,1);
    --font-display:'Jersey 15', ui-monospace, monospace;
    --font-body:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg-soft:#221b20; --card:#2f2730; --ink:#f4eef2; --muted:#b9aab3; --line:rgba(255,255,255,0.12);
      --shadow-md:0 6px 18px rgba(0,0,0,0.42); --shadow-lg:0 14px 34px rgba(0,0,0,0.55); }
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  html{overflow:hidden;}
  body{ font-family:var(--font-body); background:var(--bg-soft); color:var(--ink); line-height:1.3; -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center; align-items:flex-start; overflow:hidden; height:100vh; height:100dvh;
    padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  .wrap{ width:100%; max-width:min(440px, 96vw); height:100%; display:flex; flex-direction:column; gap: clamp(5px, 1.1dvh, 9px); position:relative; }

  .topbar{ flex:0 0 auto; display:flex; align-items:center; gap:8px; background:var(--card); border-radius:var(--r-lg); padding:9px 13px; box-shadow:var(--shadow-sm); }
  .eyebrow{ font-family:var(--font-display); font-size:clamp(10px,1.2vw,14px); letter-spacing:.5px; color:var(--plum); background:rgba(95,76,87,0.10); padding:6px 10px; border-radius:var(--r-pill); flex:0 0 auto; white-space:nowrap; }
  h1{ font-family:var(--font-display); font-size:clamp(16px,2.5vw,26px); color:var(--ink); flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icon{ flex:0 0 auto; appearance:none; border:none; cursor:pointer; width:clamp(30px,3vw,38px); height:clamp(30px,3vw,38px); border-radius:50%; background:rgba(95,76,87,0.10); color:var(--plum); font-size:16px; display:flex; align-items:center; justify-content:center; }
  button:focus-visible{ outline:3px solid var(--electric); outline-offset:2px; }

  .timerbar{ flex:0 0 auto; height:10px; background:rgba(95,76,87,0.15); border-radius:var(--r-pill); overflow:hidden; }
  .timerfill{ height:100%; width:100%; background:var(--green); border-radius:var(--r-pill); transition:width .12s linear, background .3s; }

  .stats{ flex:0 0 auto; display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:8px; }
  .stat{ background:var(--card); border-radius:var(--r-md); padding:7px 6px; box-shadow:var(--shadow-sm); text-align:center; }
  .stat .k{ font-size:clamp(9px,1vw,11px); color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .stat .v{ font-family:var(--font-display); font-size:clamp(16px,2.4vw,24px); color:var(--ink); line-height:1.1; margin-top:2px; }
  .stat .v small{ font-family:var(--font-body); font-size:clamp(9px,1vw,11px); color:var(--muted); font-weight:600; }
  .stat.bump{ animation:bump .3s var(--smooth); }
  @keyframes bump{ 0%{transform:scale(1);} 40%{transform:scale(1.12);} 100%{transform:scale(1);} }

  .boardwrap{ flex:1 1 auto; display:flex; align-items:center; justify-content:center; min-height:0; position:relative; }
  .board{ width:min(100%, 50dvh); aspect-ratio:1; background:var(--plum); border-radius:var(--r-lg); padding:clamp(5px,1.2vw,8px); display:grid; grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(5,1fr); gap:clamp(4px,1vw,7px); box-shadow:var(--shadow-md); touch-action:none; user-select:none; -webkit-user-select:none; }
  .cell{ position:relative; background:rgba(255,255,255,0.06); border-radius:var(--r-sm); overflow:hidden; }
  .cell.filled{ box-shadow:inset 0 0 0 2px rgba(255,255,255,0.16); cursor:grab; }
  .cell img, .cell .img-fallback{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; -webkit-user-drag:none; }
  .cell .img-fallback{ display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:clamp(10px,1.6vw,16px); color:#fff; background:var(--plum-deep); }
  .val{ position:absolute; left:3px; bottom:2px; font-family:var(--font-display); font-size:clamp(11px,2.2vw,18px); color:#fff; background:rgba(20,14,20,0.6); padding:0 5px; border-radius:var(--r-pill); pointer-events:none; }
  .cell.dragging{ opacity:.35; }
  .cell.target{ box-shadow:inset 0 0 0 3px var(--amber); }
  .cell.badtarget{ box-shadow:inset 0 0 0 3px var(--red); }
  .cell.pop{ animation:pop .22s var(--smooth); }
  @keyframes pop{ 0%{transform:scale(.55);} 65%{transform:scale(1.18);} 100%{transform:scale(1);} }

  .ghost{ position:fixed; z-index:50; pointer-events:none; border-radius:var(--r-sm); overflow:hidden; box-shadow:var(--shadow-lg); }
  .ghost img{ width:100%; height:100%; object-fit:cover; }
  .ghost .val{ font-size:16px; }
  .pluspop{ position:fixed; z-index:55; pointer-events:none; font-family:var(--font-display); color:var(--amber); text-shadow:0 2px 6px rgba(0,0,0,.5); animation:rise .7s var(--smooth) forwards; }
  @keyframes rise{ 0%{opacity:1; transform:translateY(0) scale(1);} 100%{opacity:0; transform:translateY(-38px) scale(1.3);} }
  .combo{ position:absolute; top:6px; left:50%; transform:translateX(-50%); z-index:40; font-family:var(--font-display); font-size:clamp(18px,4vw,30px); color:#fff; background:var(--amber); padding:3px 14px; border-radius:var(--r-pill); box-shadow:var(--shadow-md); opacity:0; }
  .combo.show{ animation:comboPulse .5s var(--smooth); }
  @keyframes comboPulse{ 0%{opacity:0; transform:translateX(-50%) scale(.6);} 40%{opacity:1; transform:translateX(-50%) scale(1.1);} 100%{opacity:1; transform:translateX(-50%) scale(1);} }

  .hint{ flex:0 0 auto; text-align:center; font-size:clamp(10px,1.3vw,13px); color:var(--muted); }
  .hint b{ color:var(--ink); }
  .brand{ flex:0 0 auto; text-align:center; font-family:var(--font-display); font-size:clamp(10px,1.2vw,13px); color:var(--muted); letter-spacing:.5px; }

  .overlay{ position:absolute; inset:0; background:rgba(62,50,58,0.92); border-radius:var(--r-lg); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; z-index:70; padding:20px; }
  .overlay.hidden{ display:none; }
  .overlay h2{ font-family:var(--font-display); font-size:clamp(26px,6vw,40px); color:#fff; margin-bottom:6px; }
  .overlay p{ color:rgba(255,255,255,0.82); font-size:clamp(13px,1.7vw,16px); margin-bottom:6px; max-width:280px; }
  .overlay .result{ color:#fff; font-size:clamp(15px,2vw,18px); margin:8px 0 4px; }
  .overlay .result b{ color:var(--amber); }
  .bigbtn{ appearance:none; border:none; cursor:pointer; font-family:var(--font-display); font-size:clamp(20px,3.5vw,26px); background:var(--amber); color:#4a2c10; padding:13px 34px; border-radius:var(--r-pill); box-shadow:var(--shadow-md); margin-top:14px; }
  .initrow{ display:flex; gap:8px; justify-content:center; margin:12px 0 4px; }
  .initrow input{ width:120px; text-transform:uppercase; text-align:center; font-family:var(--font-display); font-size:20px; letter-spacing:4px; padding:7px; border:none; border-radius:var(--r-sm); background:#fff; color:var(--ink); }
  .savebtn{ appearance:none; border:none; cursor:pointer; font-family:var(--font-body); font-weight:600; font-size:14px; background:#fff; color:var(--plum); padding:8px 18px; border-radius:var(--r-sm); }
  .lb{ width:100%; max-width:280px; margin-top:12px; }
  .lb h3{ font-family:var(--font-display); font-size:13px; color:rgba(255,255,255,0.85); margin-bottom:5px; }
  .lb ol{ list-style:none; }
  .lb li{ display:flex; gap:8px; font-size:12.5px; color:#fff; padding:4px 8px; border-radius:var(--r-sm); }
  .lb li:nth-child(odd){ background:rgba(255,255,255,0.08); }
  .lb .rank{ font-family:var(--font-display); color:var(--amber); width:18px; }
  .lb .who{ font-family:var(--font-display); letter-spacing:1px; width:40px; }
  .lb .sc{ margin-left:auto; }
  .lb .me{ box-shadow:inset 0 0 0 2px var(--amber); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <span class="eyebrow">BOT MERGE</span>
      <h1>Rush</h1>
      <button class="icon" id="mute" type="button" aria-label="Sound">🔊</button>
    </div>
    <div class="timerbar"><div class="timerfill" id="timerfill"></div></div>
    <div class="stats">
      <div class="stat"><div class="k">Score</div><div class="v" id="score">0</div></div>
      <div class="stat"><div class="k">Time</div><div class="v" id="time">60s</div></div>
      <div class="stat" id="stat-top"><div class="k">Top Bot</div><div class="v" id="topbot">—</div></div>
    </div>
    <div class="boardwrap">
      <div class="board" id="board" role="grid" aria-label="Bot Merge board"></div>
      <div class="combo" id="combo"></div>
    </div>
    <div class="hint">Drag a Bot onto a <b>matching</b> Bot before the board floods!</div>
    <div class="brand">a FinnBots game</div>

    <div class="overlay" id="overlay">
      <h2 id="ov-title">Bot Merge</h2>
      <p id="ov-text">Bots rain down and speed up. Drag matching Bots together to merge and score. Survive 60 seconds!</p>
      <div class="result" id="ov-result"></div>
      <div id="ov-saverow" style="display:none;">
        <div class="initrow"><input id="initials" maxlength="3" placeholder="AAA" autocomplete="off" spellcheck="false" /></div>
        <button class="savebtn" id="save" type="button">Save score</button>
        <div class="lb"><h3>Best on this device</h3><ol id="lblist"></ol></div>
      </div>
      <button class="bigbtn" id="startbtn" type="button">Tap to start</button>
    </div>
  </div>

<script>
(function(){
  'use strict';
  var ARWEAVE_BASE='https://arweave.net/_cPSCheRvzVBlZK7QwM-3nXtteMdBbUn-zJhbGRlMmo';
  var LADDER=[106,355,710,940,1150,1620,860,2106,2480,357];
  var CELLS=25, TOTAL=60000, COMBO_WINDOW=1400;
  function botForValue(v){ var idx=Math.min(Math.round(Math.log2(v))-1, LADDER.length-1); return LADDER[Math.max(0,idx)]; }
  function botImageHTML(n){ return '<img src="'+ARWEAVE_BASE+'/'+n+'.png" alt="Bot #'+n+'" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{textContent:\'#'+n+'\',className:\'img-fallback\'}));" />'; }
  var mem={}; var LS={ get:function(k){ try{return localStorage.getItem(k);}catch(e){return (k in mem)?mem[k]:null;} }, set:function(k,v){ try{localStorage.setItem(k,v);}catch(e){mem[k]=v;} } };

  var boardEl=document.getElementById('board');
  var scoreEl=document.getElementById('score'), timeEl=document.getElementById('time'), topbotEl=document.getElementById('topbot');
  var fillEl=document.getElementById('timerfill'), comboEl=document.getElementById('combo');
  var cells=[], lastVal=new Array(CELLS).fill(-1), board=new Array(CELLS).fill(0);
  var running=false, score=0, combo=0, comboExpire=0, startedAt=0, timeLeft=TOTAL, tickTimer=null, dropTimer=null;

  // build cells once (no full re-render churn)
  for(var i=0;i<CELLS;i++){ var c=document.createElement('div'); c.className='cell'; c.dataset.idx=i; cells.push(c); boardEl.appendChild(c); }

  function highest(){ var m=0; for(var i=0;i<CELLS;i++) if(board[i]>m) m=board[i]; return m; }
  function paint(i,pop){
    if(board[i]===lastVal[i] && !pop) return;
    var c=cells[i], v=board[i];
    if(v){ c.className='cell filled'; c.innerHTML=botImageHTML(botForValue(v))+'<span class="val">'+v+'</span>'; if(pop){ c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); } }
    else { c.className='cell'; c.innerHTML=''; }
    lastVal[i]=v;
  }
  function paintAll(){ for(var i=0;i<CELLS;i++) paint(i,false); updateTop(); }
  function updateTop(){ var h=highest(); topbotEl.innerHTML=h?('#'+botForValue(h)+' <small>'+h+'</small>'):'—'; }
  function updateScore(){ scoreEl.textContent=String(score); }

  function placeDrop(){
    var e=[]; for(var i=0;i<CELLS;i++) if(!board[i]) e.push(i);
    if(!e.length){ endRound('flooded'); return; }
    var idx=e[Math.floor(Math.random()*e.length)];
    board[idx]=(Math.random()<0.85)?2:4; paint(idx,true); updateTop();
  }
  function scheduleDrop(){
    if(!running) return;
    var elapsed=Date.now()-startedAt;
    var interval=Math.max(560, 1500 - elapsed*0.016);
    dropTimer=setTimeout(function(){ if(!running) return; placeDrop(); scheduleDrop(); }, interval);
  }
  function tick(){
    var elapsed=Date.now()-startedAt; timeLeft=Math.max(0,TOTAL-elapsed);
    var pct=timeLeft/TOTAL; fillEl.style.width=(pct*100)+'%';
    fillEl.style.background = pct>0.5?'var(--green)':(pct>0.25?'var(--amber)':'var(--red)');
    timeEl.textContent=Math.ceil(timeLeft/1000)+'s';
    if(combo>0 && Date.now()>comboExpire){ combo=0; }
    if(timeLeft<=0) endRound('time');
  }

  function startRound(){
    ensureAudio();
    board=new Array(CELLS).fill(0); lastVal=new Array(CELLS).fill(-1); score=0; combo=0; timeLeft=TOTAL; running=true;
    paintAll(); updateScore(); updateTop();
    document.getElementById('overlay').classList.add('hidden');
    startedAt=Date.now();
    placeDrop(); placeDrop(); placeDrop();
    clearInterval(tickTimer); tickTimer=setInterval(tick,100);
    scheduleDrop();
  }
  function endRound(reason){
    running=false; clearInterval(tickTimer); clearTimeout(dropTimer); sfxOver();
    var h=highest();
    var cur=parseInt(LS.get('botmerge_bestscore')||'0',10); var pb=score>cur; if(pb) LS.set('botmerge_bestscore',String(score));
    var ov=document.getElementById('overlay');
    document.getElementById('ov-title').textContent = reason==='flooded'?'Flooded!':"Time's up!";
    document.getElementById('ov-text').textContent = pb?'New personal best! 🎉':'Nice merging.';
    document.getElementById('ov-result').innerHTML='Score <b>'+score+'</b> · Top Bot <b>#'+botForValue(h)+'</b>';
    document.getElementById('ov-saverow').style.display='block';
    document.getElementById('save').textContent='Save score'; document.getElementById('save').disabled=false;
    document.getElementById('initials').value='';
    document.getElementById('startbtn').textContent='Play again';
    renderLB(null);
    ov.classList.remove('hidden');
  }

  // ---- Drag to merge ---------------------------------------------------------
  var drag=null;
  function idxFromPoint(x,y){ var el=document.elementFromPoint(x,y); if(!el||!el.closest) return -1; var c=el.closest('.cell'); if(!c||!boardEl.contains(c)) return -1; return +c.dataset.idx; }
  function moveGhost(e){ var s=drag.size; drag.ghost.style.left=(e.clientX-s/2)+'px'; drag.ghost.style.top=(e.clientY-s/2)+'px'; }
  function clearTargets(){ for(var i=0;i<CELLS;i++) cells[i].classList.remove('target','badtarget'); }
  function cleanup(){ if(drag){ if(drag.ghost&&drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost); clearTargets(); cells[drag.src].classList.remove('dragging'); } }

  boardEl.addEventListener('pointerdown', function(e){
    if(!running) return;
    var c=e.target.closest?e.target.closest('.cell'):null; if(!c) return;
    var idx=+c.dataset.idx; if(!board[idx]) return;
    e.preventDefault(); if(drag) cleanup();
    var rect=cells[idx].getBoundingClientRect();
    var g=document.createElement('div'); g.className='ghost'; g.style.width=rect.width+'px'; g.style.height=rect.width+'px';
    g.innerHTML=botImageHTML(botForValue(board[idx]))+'<span class="val">'+board[idx]+'</span>'; document.body.appendChild(g);
    drag={ src:idx, val:board[idx], size:rect.width, ghost:g }; moveGhost(e);
    cells[idx].classList.add('dragging');
    try{ boardEl.setPointerCapture(e.pointerId); }catch(_){}
  });
  boardEl.addEventListener('pointermove', function(e){
    if(!drag) return; e.preventDefault(); moveGhost(e); clearTargets();
    var t=idxFromPoint(e.clientX,e.clientY);
    if(t>=0 && t!==drag.src) cells[t].classList.add((board[t]===0||board[t]===drag.val)?'target':'badtarget');
  });
  boardEl.addEventListener('pointerup', function(e){
    if(!drag) return; e.preventDefault();
    var t=idxFromPoint(e.clientX,e.clientY), src=drag.src, val=drag.val; cleanup(); drag=null;
    if(t<0||t===src) return;
    if(board[t]===0){ board[t]=val; board[src]=0; paint(src,false); paint(t,false); }
    else if(board[t]===val){
      board[t]=val*2; board[src]=0; paint(src,false); paint(t,true); updateTop();
      var now=Date.now(); combo=(now<comboExpire)?combo+1:1; comboExpire=now+COMBO_WINDOW;
      var pts=(val*2)*combo; score+=pts; updateScore();
      var st=document.getElementById('stat-top'); st.classList.remove('bump'); void st.offsetWidth; st.classList.add('bump');
      plusPop(cells[t], pts); if(combo>=2) showCombo(combo); sfxMerge(combo);
    }
  });
  boardEl.addEventListener('pointercancel', function(){ if(drag){ cleanup(); drag=null; } });

  function plusPop(cell, pts){ var r=cell.getBoundingClientRect(); var p=document.createElement('div'); p.className='pluspop'; p.textContent='+'+pts; p.style.left=(r.left+r.width/2-14)+'px'; p.style.top=(r.top+r.height/2-10)+'px'; p.style.fontSize='clamp(16px,3vw,24px)'; document.body.appendChild(p); setTimeout(function(){ if(p.parentNode) p.parentNode.removeChild(p); },700); }
  function showCombo(c){ comboEl.textContent='COMBO ×'+c; comboEl.classList.remove('show'); void comboEl.offsetWidth; comboEl.classList.add('show'); comboEl.style.opacity='1'; clearTimeout(showCombo._t); showCombo._t=setTimeout(function(){ comboEl.style.opacity='0'; },700); }

  // ---- Sound (WebAudio, no assets) ------------------------------------------
  var actx=null, muted=false;
  function ensureAudio(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
  function beep(freq,dur,type){ if(muted||!actx) return; try{ var o=actx.createOscillator(),g=actx.createGain(); o.type=type||'sine'; o.frequency.value=freq; o.connect(g); g.connect(actx.destination); var t=actx.currentTime; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.22,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur+0.02); }catch(e){} }
  function sfxMerge(c){ beep(300+Math.min(c,9)*70,0.12,'triangle'); }
  function sfxOver(){ beep(320,0.16,'sawtooth'); setTimeout(function(){beep(200,0.24,'sawtooth');},150); }
  document.getElementById('mute').addEventListener('click', function(){ muted=!muted; this.textContent=muted?'🔇':'🔊'; });

  // ---- Leaderboard -----------------------------------------------------------
  function loadLB(){ try{ return JSON.parse(LS.get('botmerge_lb')||'[]'); }catch(e){ return []; } }
  function saveLB(a){ LS.set('botmerge_lb', JSON.stringify(a.slice(0,10))); }
  function renderLB(hi){ var arr=loadLB(), ol=document.getElementById('lblist'); ol.innerHTML=''; if(!arr.length){ ol.innerHTML='<li style="justify-content:center;">No scores yet!</li>'; return; }
    arr.slice(0,5).forEach(function(e,i){ var li=document.createElement('li'); if(i===hi) li.className='me';
      li.innerHTML='<span class="rank">'+(i+1)+'</span><span class="who">'+e.who+'</span><span class="sc">'+e.score+' · #'+botForValue(e.tile)+'</span>'; ol.appendChild(li); }); }
  function saveScore(){ var who=(document.getElementById('initials').value||'AAA').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3)||'AAA';
    var arr=loadLB(); arr.push({ who:who, score:score, tile:highest(), ts:Date.now() });
    arr.sort(function(a,b){ return (b.score-a.score)||(b.tile-a.tile)||(a.ts-b.ts); });
    var idx=arr.findIndex(function(e){ return e.who===who&&e.score===score&&e.tile===highest(); });
    saveLB(arr); renderLB(idx<5?idx:null); document.getElementById('save').textContent='Saved ✓'; document.getElementById('save').disabled=true; }

  document.getElementById('startbtn').addEventListener('click', startRound);
  document.getElementById('save').addEventListener('click', function(){ if(!this.disabled) saveScore(); });
  document.getElementById('initials').addEventListener('keydown', function(e){ if(e.key==='Enter'){ var b=document.getElementById('save'); if(!b.disabled) saveScore(); } });

  paintAll();
})();
</script>
</body>
</html>
